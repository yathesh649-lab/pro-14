<!doctype html>

<html lang="en">
<head>
    <title>Absolute Positioning Example</title>
    <meta charset="utf-8">

    <style>
        body {
            width: 700px;
            margin: 40px auto;
            padding: 25px;
            background-color: #f4f9ff;
            border: 2px solid #2c3e50;
            font-family: Arial, Helvetica, sans-serif;
            position: relative;
        }

        h1 {
            color: #1a5276;
            text-align: center;
        }

        p {
            margin: 0;
        }

        main {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
        }

        ul {
            line-height: 2;
        }

        a {
            color: #008000;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            color: #e67e22;
            text-decoration: underline;
        }

        aside {
            width: 150px;
            padding: 15px;
            background-color: #ffe6cc;
            border: 2px solid #e67e22;
            border-radius: 10px;
            position: absolute;
            right: 20px;
            top: 80px;
        }

        aside a {
            color: #c0392b;
        }

    </style>
</head>

<body>

    <main>
        <h1>Upcoming Technology Events</h1>

        <ul>
            <li>October: <a href="events/web.html">Web Development Workshop</a></li>
            <li>November: <a href="events/ai.html">Artificial Intelligence Seminar</a></li>
            <li>January: <a href="events/cloud.html">Cloud Computing Conference</a></li>
        </ul>

        <p>Register now to reserve your seat for the events.</p>
    </main>

    <aside>
        <p>
            <a href="registration.html">
                Register and get a free entry pass!
            </a>
        </p>
    </aside>

</body>
</html>
